[project]
name = "sar"
version = "0.1.0"
description = "Distributed multi-UAV search-and-rescue coordination system"
requires-python = ">=3.11"
dependencies = ["pyzmq>=25", "msgpack>=1.0", "pyyaml>=6.0", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
experiments = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
